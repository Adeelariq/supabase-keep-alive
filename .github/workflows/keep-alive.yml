name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 9 * * *"  # Every day at 09:00 UTC (2:30 PM IST)
  workflow_dispatch:       # Manual trigger button in Actions tab

permissions:
  contents: write          # Required for the commit step

jobs:
  ping-supabase:
    runs-on: ubuntu-latest

    steps:

      # ── PROJECT 1 ──────────────────────────────────────────
      - name: Ping Project 1
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL_1 }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_KEY_1 }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY_1 }}")
          echo "Project 1 → Status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "✅ Project 1 is alive!"
          else
            echo "❌ Project 1 ping failed with status $STATUS"
          fi

      # ── PROJECT 2 ──────────────────────────────────────────
      - name: Ping Project 2
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL_2 }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_KEY_2 }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY_2 }}")
          echo "Project 2 → Status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "✅ Project 2 is alive!"
          else
            echo "❌ Project 2 ping failed with status $STATUS"
          fi

      # ── PROJECT 3 ──────────────────────────────────────────
      - name: Ping Project 3
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL_3 }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_KEY_3 }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY_3 }}")
          echo "Project 3 → Status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "✅ Project 3 is alive!"
          else
            echo "❌ Project 3 ping failed with status $STATUS"
          fi

      # ── PROJECT 4 ──────────────────────────────────────────
      - name: Ping Project 4
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL_4 }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_KEY_4 }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY_4 }}")
          echo "Project 4 → Status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "✅ Project 4 is alive!"
          else
            echo "❌ Project 4 ping failed with status $STATUS"
          fi

      # ── KEEP REPO ACTIVE (stops GitHub disabling the cron) ──
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Commit timestamp to keep repo active
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          echo "Last ping: $(date -u)" > last-ping.txt
          git add last-ping.txt
          git diff --staged --quiet || git commit -m "chore: keep-alive ping $(date -u +'%Y-%m-%d')"
          git push
