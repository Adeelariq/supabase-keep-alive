name: Keep Supabase Alive

on:
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Debug Project 1
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_1 }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY_1 }}
        run: |
          echo "URL length: ${#SUPABASE_URL}"
          echo "KEY length: ${#SUPABASE_KEY}"

          curl -i "$SUPABASE_URL/rest/v1/keep_alive?select=id" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY"
