name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Thesis Treasure
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_1 }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY_1 }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SUPABASE_URL/rest/v1/admin_users?select=id" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")
          echo "Project 1 Status: $STATUS"
          [ "$STATUS" = "200" ]

      - name: Ping Exam Result
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_2 }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY_2 }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SUPABASE_URL/rest/v1/users?select=id" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")
          echo "Project 2 Status: $STATUS"
          [ "$STATUS" = "200" ]

      - name: Ping Tram-A-Legacy
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_3 }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY_3 }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SUPABASE_URL/rest/v1/products?select=id" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")
          echo "Project 3 Status: $STATUS"
          [ "$STATUS" = "200" ]

      - name: Ping Champion Textiles
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_4 }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY_4 }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SUPABASE_URL/rest/v1/products?select=id" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")
          echo "Project 4 Status: $STATUS"
          [ "$STATUS" = "200" ]

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Update keep-alive timestamp
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          echo "Last successful ping: $(date -u)" > last-ping.txt
          git add last-ping.txt
          git diff --staged --quiet || git commit -m "chore: keep alive $(date -u +'%Y-%m-%d')"
          git push
