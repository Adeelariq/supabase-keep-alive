name: Test Supabase

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test Project 1
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_1 }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY_1 }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/admin_users?select=*" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")

          echo "Status: $STATUS"
